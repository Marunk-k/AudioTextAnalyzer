<!doctype html><html xmlns:th='http://www.thymeleaf.org' lang='ru'><head><meta charset='UTF-8'><title>Словари</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link href='/css/app.css' rel='stylesheet'></head><body><div th:replace='~{fragments/navbar :: navbar}'></div><main class='container page-shell'><h2>Пользовательские словари</h2><div th:if='${warning}' class='alert alert-warning' th:text='${warning}'></div><section class='soft-card p-3 mb-4'><h3 class='h5'>Слова-паразиты</h3><form method='post' action='/settings/fillers' class='d-flex gap-2 mb-3'><input type='hidden' th:name='${_csrf.parameterName}' th:value='${_csrf.token}'><input class='form-control' name='value' placeholder='Слово или фраза для удаления'><button class='btn btn-pink'>Добавить</button></form><table class='table'><tr><th>Фраза</th><th>Включено</th><th></th></tr><tr th:each='e : ${entries}'><td th:text='${e.sourceValue}'></td><td><form method='post' th:action='@{/settings/fillers/{id}/toggle(id=${e.id})}'><input type='hidden' th:name='${_csrf.parameterName}' th:value='${_csrf.token}'><input type='hidden' name='enabled' th:value='${!e.enabled}'><button class='btn btn-soft btn-sm' th:text='${e.enabled ? "Выключить" : "Включить"}'></button></form></td><td><form method='post' th:action='@{/settings/dictionary/{id}/delete(id=${e.id})}'><input type='hidden' th:name='${_csrf.parameterName}' th:value='${_csrf.token}'><button class='btn btn-outline-danger btn-sm'>Удалить</button></form></td></tr></table></section><section class='soft-card p-3'><h3 class='h5'>Словарь замен</h3><form method='post' action='/settings/replacements' class='row g-2 mb-3'><input type='hidden' th:name='${_csrf.parameterName}' th:value='${_csrf.token}'><div class='col-md-5'><input class='form-control' name='sourceValue' placeholder='Что заменить'></div><div class='col-md-5'><input class='form-control' name='targetValue' placeholder='На что заменить'></div><div class='col-md-2'><button class='btn btn-pink w-100'>Добавить</button></div></form><table class='table'><tr><th>Исходное</th><th>Замена</th><th></th></tr><tr th:each='e : ${replacementEntries}'><td th:text='${e.sourceValue}'></td><td th:text='${e.targetValue}'></td><td><form method='post' th:action='@{/settings/dictionary/{id}/delete(id=${e.id})}'><input type='hidden' th:name='${_csrf.parameterName}' th:value='${_csrf.token}'><button class='btn btn-outline-danger btn-sm'>Удалить</button></form></td></tr></table></section></main></body></html>
