<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Словари</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container page-shell">
  <h2 class="mb-3">Пользовательские словари</h2>
  <div th:if="${warning}" class="alert alert-warning" th:text="${warning}"></div>

  <div class="row g-4 align-items-start">
    <div class="col-lg-6">
      <section class="soft-card p-3 h-100">
        <h3 class="h5">Словарь замен</h3>
        <p class="text-muted-custom">Введите исходное значение и текст, на который его нужно заменить.</p>
        <form method="post" action="/settings/replacements" class="row g-2 mb-3">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <div class="col-md-5"><input class="form-control" name="sourceValue" placeholder="Что заменить"></div>
          <div class="col-md-5"><input class="form-control" name="targetValue" placeholder="На что заменить"></div>
          <div class="col-md-2"><button class="btn btn-pink w-100">Добавить</button></div>
        </form>
        <table class="table align-middle">
          <tr><th>Исходное</th><th>Замена</th><th></th></tr>
          <tr th:each="e : ${replacementEntries}">
            <td th:text="${e.sourceValue}"></td>
            <td th:text="${e.targetValue}"></td>
            <td class="text-end">
              <form method="post" th:action="@{/settings/dictionary/{id}/delete(id=${e.id})}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-outline-danger btn-sm">Удалить</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(replacementEntries)}"><td colspan="3" class="text-muted-custom">Пока нет замен.</td></tr>
        </table>
      </section>
    </div>

    <div class="col-lg-6">
      <section class="soft-card p-3 h-100">
        <h3 class="h5">Словарь слов-паразитов</h3>
        <p class="text-muted-custom">Добавьте слово или фразу, которые нужно удалять при предобработке.</p>
        <form method="post" action="/settings/fillers" class="d-flex gap-2 mb-3">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <input class="form-control" name="value" placeholder="Слово или фраза для удаления">
          <button class="btn btn-pink">Добавить</button>
        </form>
        <table class="table align-middle">
          <tr><th>Фраза</th><th></th></tr>
          <tr th:each="e : ${entries}">
            <td th:text="${e.sourceValue}"></td>
            <td class="text-end">
              <form method="post" th:action="@{/settings/dictionary/{id}/delete(id=${e.id})}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-outline-danger btn-sm">Удалить</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(entries)}"><td colspan="2" class="text-muted-custom">Пока нет слов-паразитов.</td></tr>
        </table>
      </section>
    </div>
  </div>
</main>
</body>
</html>
