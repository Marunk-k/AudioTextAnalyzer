spring:
  application:
    name: audiotext-analyzer
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: jdbc:postgresql://localhost:5432/audiotext_analyzer
    username: audiotext_user
    password: audiotext_password
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      continue-on-error: true

app:
  temp-dir: data/temp
  storage:
    upload-dir: data/uploads
    converted-dir: data/converted
    export-dir: data/exports
  audio:
    # Windows example: C:/ffmpeg/bin/ffmpeg.exe
    ffmpeg-path: ffmpeg
    # Optional. If omitted, ffprobe is searched next to ffmpeg.exe or in PATH.
    ffprobe-path:
    allowed-extensions: [wav, mp3, m4a, ogg, flac]
  vosk:
    enabled: true
    model-path: models/vosk-model-small-ru
    sample-rate: 16000
  gigachat:
    enabled: true
    credentials: ${GIGACHAT_CREDENTIALS:}
    scope: ${GIGACHAT_SCOPE:GIGACHAT_API_PERS}
    model: ${GIGACHAT_MODEL:GigaChat}
    verify-ssl-certs: false
    timeout-seconds: 60
  processing:
    use-mock-transcription-if-vosk-unavailable: false
    low-confidence-threshold: 0.6
