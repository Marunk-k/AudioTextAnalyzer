<!doctype html><html xmlns:th='http://www.thymeleaf.org' lang='ru'><head><meta charset='UTF-8'><title>Справка</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link href='/css/app.css' rel='stylesheet'></head><body style='background:var(--sage-soft)'><div th:replace='~{fragments/navbar :: navbar}'></div><main class='container page-shell'><div class='soft-card p-4'><h2>Справка</h2><div class='accordion' id='faq'><div class='accordion-item' th:each='item,stat:${faqItems}'><h2 class='accordion-header'><button class='accordion-button collapsed' data-bs-toggle='collapse' th:attr='data-bs-target=${"#c"+stat.index}' th:text='${item.question}'></button></h2><div class='accordion-collapse collapse' th:id='${"c"+stat.index}'><div class='accordion-body' th:text='${item.answer}'></div></div></div></div></div></main><script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js'></script></body></html>
