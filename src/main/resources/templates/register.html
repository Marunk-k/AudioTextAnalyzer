<!doctype html><html xmlns:th='http://www.thymeleaf.org' lang='ru'><head><meta charset='UTF-8'><title>Регистрация</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link href='/css/app.css' rel='stylesheet'></head><body><div th:replace='~{fragments/navbar :: navbar}'></div><main class='container page-shell auth-page'><div class='auth-card p-4 p-md-5'><h1 class='h3 fw-bold mb-4 text-center'>Создание аккаунта</h1><div th:if='${error}' class='alert alert-danger' th:text='${error}'></div><form method='post' th:action='@{/register}' class='d-grid gap-3'><div><label class='form-label' for='login'>Логин</label><input id='login' name='login' class='form-control' required></div><div><label class='form-label' for='password'>Пароль</label><input id='password' type='password' name='password' class='form-control' required></div><div><label class='form-label' for='confirmPassword'>Повтор пароля</label><input id='confirmPassword' type='password' name='confirmPassword' class='form-control' required></div><input type='hidden' th:name='${_csrf.parameterName}' th:value='${_csrf.token}'><button class='btn btn-pink pill-button' type='submit'>Зарегистрироваться</button></form><p class='mt-3 mb-0 text-center text-muted-custom'>Уже есть аккаунт? <a href='/login'>Войти</a></p></div></main></body></html>
