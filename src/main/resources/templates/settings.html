<!doctype html><html xmlns:th='http://www.thymeleaf.org'><head><meta charset='UTF-8'><title>Словари</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link href='/css/app.css' rel='stylesheet'></head><body><div th:replace='~{fragments/navbar :: navbar}'></div><main class='container page-shell'><h2>Мои слова-паразиты</h2><form method='post' action='/settings/fillers' class='d-flex gap-2 mb-3'><input type='hidden' th:name='${_csrf.parameterName}' th:value='${_csrf.token}'><input class='form-control' name='value' placeholder='Добавить слово/фразу для удаления'><button class='btn btn-pink'>Добавить</button></form><table class='table'><tr><th>Фраза</th><th>Включено</th><th></th></tr><tr th:each='e : ${entries}'><td th:text='${e.sourceValue}'></td><td><form method='post' th:action='@{/settings/fillers/{id}/toggle(id=${e.id})}'><input type='hidden' th:name='${_csrf.parameterName}' th:value='${_csrf.token}'><input type='hidden' name='enabled' th:value='${!e.enabled}'><button class='btn btn-soft btn-sm' th:text='${e.enabled ? "Выключить" : "Включить"}'></button></form></td><td><form method='post' th:action='@{/settings/fillers/{id}/delete(id=${e.id})}'><input type='hidden' th:name='${_csrf.parameterName}' th:value='${_csrf.token}'><button class='btn btn-outline-danger btn-sm'>Удалить</button></form></td></tr></table></main></body></html>
