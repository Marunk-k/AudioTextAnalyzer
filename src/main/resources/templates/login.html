<!doctype html><html xmlns:th='http://www.thymeleaf.org' lang='ru'><head><meta charset='UTF-8'><title>Вход</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link href='/css/app.css' rel='stylesheet'></head><body><div th:replace='~{fragments/navbar :: navbar}'></div><main class='container page-shell auth-page'><div class='auth-card p-4 p-md-5'><h1 class='h3 fw-bold mb-4 text-center'>Вход в систему</h1><div th:if='${param.error}' class='alert alert-danger'>Неверный логин или пароль.</div><div th:if='${param.registered}' class='alert alert-success'>Регистрация выполнена. Теперь войдите в систему.</div><div th:if='${param.logout}' class='alert alert-info'>Вы вышли из системы.</div><form method='post' th:action='@{/login}' class='d-grid gap-3'><div><label class='form-label' for='username'>Логин</label><input id='username' name='username' class='form-control' required></div><div><label class='form-label' for='password'>Пароль</label><input id='password' type='password' name='password' class='form-control' required></div><input type='hidden' th:name='${_csrf.parameterName}' th:value='${_csrf.token}'><button class='btn btn-pink pill-button' type='submit'>Войти</button></form></div></main></body></html>
