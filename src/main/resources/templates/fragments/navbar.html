<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg sticky-top nav-shell">
  <div class="container">
    <a class="navbar-brand fw-bold text-light" href="/">AudioText Analyzer</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav mx-auto nav-pill">
        <li class="nav-item"><a class="nav-link" href="/">Главная</a></li>
        <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" href="/workspace">Рабочая область</a></li>
        <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" href="/projects">Проекты</a></li>
        <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" href="/settings">Словари</a></li>
        <li class="nav-item"><a class="nav-link" href="/help">Справка</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2" sec:authorize="isAnonymous()">
        <a class="btn btn-soft pill-button" href="/login">Войти</a>
        <a class="btn btn-pink pill-button" href="/register">Регистрация</a>
      </div>
      <form sec:authorize="isAuthenticated()" method="post" th:action="@{/logout}" class="ms-lg-3 mb-0">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-pink pill-button" type="submit">Выйти</button>
      </form>
    </div>
  </div>
</nav>
</body>
</html>
