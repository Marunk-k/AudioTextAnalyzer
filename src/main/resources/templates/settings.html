<!doctype html><html xmlns:th='http://www.thymeleaf.org' lang='ru'><head><meta charset='UTF-8'><title>Словари</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link href='/css/app.css' rel='stylesheet'></head><body><div th:replace='~{fragments/navbar :: navbar}'></div><main class='container page-shell'><h2>Словари</h2><p class='text-muted-custom'>Пользовательский словарь применяется только к вашим проектам. Системный словарь применяется для всех.</p><div class='row g-3'><div class='col-lg-6'><div class='soft-card p-3'><h5>Ваш словарь</h5><form method='post' th:action='@{/settings/dictionary/save}' class='row g-2 mb-3'><input type='hidden' th:name='${_csrf.parameterName}' th:value='${_csrf.token}'><div class='col-5'><input class='form-control' name='source' placeholder='например: мама' required></div><div class='col-5'><input class='form-control' name='replacement' placeholder='например: МАма' required></div><div class='col-2'><button class='btn btn-pink w-100'>Сохранить</button></div></form><div th:if='${#maps.isEmpty(userDictionary)}' class='empty-state p-3'>Пока нет пользовательских замен.</div><table th:if='${!#maps.isEmpty(userDictionary)}' class='table table-sm'><tr><th>Исходное</th><th>Замена</th><th></th></tr><tr th:each='e : ${userDictionary.entrySet()}'><td th:text='${e.key}'></td><td th:text='${e.value}'></td><td><form method='post' th:action='@{/settings/dictionary/delete}'><input type='hidden' th:name='${_csrf.parameterName}' th:value='${_csrf.token}'><input type='hidden' name='source' th:value='${e.key}'><button class='btn btn-sm btn-soft'>Удалить</button></form></td></tr></table></div></div><div class='col-lg-6'><div class='soft-card p-3'><h5>Системный словарь</h5><div th:if='${#maps.isEmpty(systemDictionary)}' class='empty-state p-3'>Системный словарь пуст.</div><table th:if='${!#maps.isEmpty(systemDictionary)}' class='table table-sm'><tr><th>Исходное</th><th>Замена</th></tr><tr th:each='e : ${systemDictionary.entrySet()}'><td th:text='${e.key}'></td><td th:text='${e.value}'></td></tr></table></div></div></div></main></body></html>
